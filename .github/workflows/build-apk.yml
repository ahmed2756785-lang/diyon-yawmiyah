name: Build signed Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore Flutter source bundle
        shell: bash
        run: |
          cat project-source.part0* > /tmp/project-source.tar.gz.b64
          base64 --decode /tmp/project-source.tar.gz.b64 | tar -xz --strip-components=1
          test -f pubspec.yaml
          test -f lib/main.dart
          test -f tool/patch_gradle.py

      - name: Inspect source errors
        run: |
          echo '--- pubspec.yaml ---'
          sed -n '1,100p' pubspec.yaml
          echo '--- add_customer_screen.dart ---'
          nl -ba lib/screens/add_customer_screen.dart | sed -n '1,100p'
          echo '--- main.dart ---'
          sed -n '1,70p' lib/main.dart
          echo '--- widget_test.dart ---'
          sed -n '1,80p' test/widget_test.dart

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.29.3'
          cache: true

      - name: Generate Android project
        run: |
          if [[ ! -d android ]]; then
            flutter create . --platforms=android --org com.diyon --project-name diyon_yawmiyah
          fi
          python3 tool/patch_gradle.py

      - name: Create release signing key
        run: |
          mkdir -p android/app
          keytool -genkeypair -v -keystore android/app/release-keystore.jks -storepass temporary123 -alias upload -keypass temporary123 -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Diyon Yawmiyah, OU=Mobile, O=Personal, L=Sanaa, ST=Sanaa, C=YE"
          cat > android/key.properties <<'PROPS'
          storePassword=temporary123
          keyPassword=temporary123
          keyAlias=upload
          storeFile=release-keystore.jks
          PROPS

      - name: Configure Gradle release signing
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/build.gradle.kts')
          if p.exists():
              s = p.read_text()
              if 'val keystoreProperties = ' not in s:
                  s = '''val keystoreProperties = java.util.Properties()
          val keystorePropertiesFile = rootProject.file("key.properties")
          if (keystorePropertiesFile.exists()) keystoreProperties.load(java.io.FileInputStream(keystorePropertiesFile))

          ''' + s
              if 'create("release")' not in s:
                  block = '''    signingConfigs {
                  create("release") {
                      keyAlias = keystoreProperties["keyAlias"] as String
                      keyPassword = keystoreProperties["keyPassword"] as String
                      storeFile = file(keystoreProperties["storeFile"] as String)
                      storePassword = keystoreProperties["storePassword"] as String
                  }
              }
          '''
                  s = s.replace('    buildTypes {', block + '    buildTypes {', 1)
              s = s.replace('signingConfig = signingConfigs.getByName("debug")', 'signingConfig = signingConfigs.getByName("release")')
              p.write_text(s)
          else:
              p = Path('android/app/build.gradle')
              s = p.read_text()
              if 'signingConfigs {' not in s:
                  s = "def keystoreProperties = new Properties()\ndef keystorePropertiesFile = rootProject.file('key.properties')\nif (keystorePropertiesFile.exists()) { keystoreProperties.load(new FileInputStream(keystorePropertiesFile)) }\n" + s
                  block = '''    signingConfigs {
                  release {
                      keyAlias keystoreProperties['keyAlias']
                      keyPassword keystoreProperties['keyPassword']
                      storeFile file(keystoreProperties['storeFile'])
                      storePassword keystoreProperties['storePassword']
                  }
              }
          '''
                  s = s.replace('    buildTypes {', block + '    buildTypes {', 1)
              s = s.replace('signingConfig signingConfigs.debug', 'signingConfig signingConfigs.release')
              p.write_text(s)
          PY

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze Dart source
        run: flutter analyze

      - name: Build release APK
        run: flutter build apk --release

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk Diyon-Yawmiyah.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Diyon-Yawmiyah.apk
          path: Diyon-Yawmiyah.apk
          if-no-files-found: error
