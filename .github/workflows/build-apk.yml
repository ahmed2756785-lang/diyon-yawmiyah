name: Build Signed APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Prepare Android project
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --org com.diyon.yawmiyah --project-name diyon_yawmiyah /tmp/scaffold
            cp -r /tmp/scaffold/android ./android
          fi
          cp tool/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          python3 tool/patch_gradle.py
          rm -rf test

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze (non-blocking)
        run: flutter analyze || true

      - name: Build release APK
        run: flutter build apk --release

      - name: Create signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
          SECRET_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ] && [ -n "$SECRET_PASS" ]; then
            echo "$KEYSTORE_B64" | base64 -d > $RUNNER_TEMP/diyon.jks
            echo "KS_PASS=$SECRET_PASS" >> $GITHUB_ENV
            echo "KS_ALIAS=diyon" >> $GITHUB_ENV
          else
            keytool -genkeypair -v -keystore $RUNNER_TEMP/diyon.jks -alias diyon \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass diyon123456 -keypass diyon123456 \
              -dname "CN=Diyon Yawmiyah, OU=App, O=Diyon, C=SA"
            echo "KS_PASS=diyon123456" >> $GITHUB_ENV
            echo "KS_ALIAS=diyon" >> $GITHUB_ENV
          fi

      - name: Sign APK
        run: |
          APKSIGNER=$(ls $ANDROID_HOME/build-tools/*/apksigner | sort -V | tail -1)
          $APKSIGNER sign --ks $RUNNER_TEMP/diyon.jks \
            --ks-key-alias "$KS_ALIAS" \
            --ks-pass pass:$KS_PASS --key-pass pass:$KS_PASS \
            --out Diyon-Yawmiyah.apk build/app/outputs/flutter-apk/app-release.apk
          $APKSIGNER verify --verbose Diyon-Yawmiyah.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Diyon-Yawmiyah.apk
          path: Diyon-Yawmiyah.apk
